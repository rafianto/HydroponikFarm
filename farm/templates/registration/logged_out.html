{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout - HydroFarm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    
    <div class="w-full max-w-md">
        <!-- Logo & Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-gray-500 rounded-2xl shadow-lg mb-4">
                <i class="fas fa-leaf text-white text-2xl"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-gray-900">HydroFarm</h1>
            <p class="text-gray-500 mt-1">Sistem Manajemen Hidroponik</p>
        </div>

        <!-- Card Logout -->
        <div class="bg-white rounded-2xl shadow-xl border border-gray-200 p-8 text-center">
            <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-gray-100 mb-5">
                <i class="fas fa-sign-out-alt text-gray-500 text-2xl"></i>
            </div>
            <h2 class="text-xl font-bold text-gray-800 mb-2">Anda Telah Keluar</h2>
            <p class="text-sm text-gray-500 mb-6">Terima kasih telah menggunakan aplikasi HydroFarm. Sampai jumpa kembali!</p>
            
            <a href="{% url 'login' %}" class="w-full inline-flex justify-center items-center gap-2 py-3 bg-emerald-600 text-white rounded-lg font-semibold hover:bg-emerald-700 transition shadow-sm">
                <i class="fas fa-sign-in-alt"></i> Login Kembali
            </a>
        </div>
    </div>
</body>
</html>
